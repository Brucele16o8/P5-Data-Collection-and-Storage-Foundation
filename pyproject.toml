[project]
name = "p5-data-collection-and-storage-foundation"
version = "0.1.0"
description = "Local MongoDB and Python foundation for Project 05 Glamira data collection and storage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "ip2location>=8.10",
    "pymongo>=4.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
